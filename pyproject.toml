[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "svcarry"
version = "0.1.0"
description = "Short-volatility ETP mechanics and a crash-aware VIX carry strategy"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "scipy>=1.10", "matplotlib>=3.7", "requests>=2.28", "PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
crosscheck = ["statsmodels>=0.14", "arch>=6.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning"]
