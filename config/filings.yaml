# ---------------------------------------------------------------------------
# Primary-source filings archived by scripts/fetch_data.py into references/filings/.
#
# Every product term asserted anywhere in this repository - leverage, fee,
# acceleration clause, benchmark index, structure - must be traceable to one of
# these documents. URLs below were resolved on EDGAR and each is a public filing;
# nothing here requires authentication.
#
# 'verified' records whether the exact wording of the term(s) we rely on has been
# read out of the archived file itself (as opposed to a secondary description).
# Anything marked false is re-checked in scripts/extract_filing_terms.py and the
# result is recorded in docs/data_sources.md.
# ---------------------------------------------------------------------------

filings:
  - key: xiv_acceleration_8k
    issuer: Credit Suisse AG
    cik: 1053092
    form: 8-K exhibit 99.1
    date: "2018-02-06"
    title: >-
      Credit Suisse announces event acceleration of VelocityShares Daily Inverse
      VIX Short Term ETNs (XIV)
    url: https://www.sec.gov/Archives/edgar/data/1053092/000095010318001572/dp86358_ex9901.htm
    local_name: CS_XIV_acceleration_2018-02-06.htm
    used_for:
      - acceleration trigger (intraday indicative value <= 20% of prior close)
      - prior closing indicative value of 108.3681 on 2018-02-02
      - accelerated valuation date and redemption mechanics
    verified: true

  - key: xiv_424b2
    issuer: Credit Suisse AG
    cik: 1053092
    form: 424B2
    date: "2017-06-30"
    title: >-
      Pricing supplement, VelocityShares VIX Short Term and Mid Term ETNs
      (XIV, ZIV, VIIX, VIIZ, TVIX, TVIZ)
    url: https://www.sec.gov/Archives/edgar/data/1053092/000095010317006323/dp77928_424b2-vix.htm
    local_name: CS_VelocityShares_424B2_2017-06-30.htm
    used_for:
      - daily investor fee factor (0.0135 for the inverse ETNs)
      - closing indicative value and daily ETN performance formulas
      - daily accrual on the three-month US Treasury rate
      - underlying index (S&P 500 VIX Short-Term Futures Index)
      - optional and event acceleration provisions
    verified: true      # 5/5 claims quoted; see reports/tables/filing_terms.csv

  - key: proshares_trust_ii_10k_2017
    issuer: ProShares Trust II
    cik: 1415311
    form: 10-K
    date: "2018-02-28"
    title: ProShares Trust II annual report for the year ended 31 December 2017
    url: https://www.sec.gov/Archives/edgar/data/1415311/000119312518067452/d535701d10k.htm
    local_name: ProSharesTrustII_10K_FY2017.htm
    used_for:
      - SVXY and UVXY structure, benchmark and fees
      - net assets outstanding by fund
      - subsequent-event disclosure of the change in daily target exposure
      - the -0.5x and 1.5x classes, and the effective date of the change
    verified: true      # 4/4 claims quoted. Note 9 "Subsequent Events" dates the
                        # change to the close of business on 27 February 2018; the
                        # configuration stores 2018-02-28 as the first RETURN under
                        # the new objective. Confirmed against the price data.

  - key: proshares_424b3_2018_02
    issuer: ProShares Trust II
    cik: 1415311
    form: 424B3
    date: "2018-02-15"
    title: ProShares Trust II prospectus (VIX funds) filed 15 February 2018
    url: https://www.sec.gov/Archives/edgar/data/1415311/000119312518047310/d526069d424b3.htm
    local_name: ProSharesTrustII_424B3_2018-02-15.htm
    used_for:
      - SVXY at -1x and UVXY at 2x immediately before the change
      - fee and benchmark wording as at February 2018
      - >-
        NAV calculation time of 4:15 p.m. ET. Load-bearing for docs/validation.md
        V6 and V9 - the funds strike NAV at 4:15 p.m. while the closing price this
        project regresses on is the 4:00 p.m. consolidated close.
      - the SVXY 2-for-1 split of July 2017 and the VIXY/UVXY 1-for-4 reverse split
    verified: true      # 7/7 claims quoted

  - key: ipath_vxx_series_b_424b2
    issuer: Barclays Bank PLC
    cik: 312070
    form: 424B2
    date: "2022-03-14"        # "Amendment No. 1 dated March 14, 2022", per the document
    title: >-
      iPath Series B S&P 500 VIX Short-Term Futures ETN - Amendment No. 1,
      suspending further sales and issuances
    url: https://www.sec.gov/Archives/edgar/data/312070/000095010322004469/dp169097_424b2-vxxetns.htm
    local_name: Barclays_iPath_VXX_SeriesB_424B2.htm
    # This is NOT the pricing supplement. It is a one-page amendment suspending
    # issuance, and it contains no fee schedule. The fee claim was recorded against
    # this entry in error and has been moved to the January-2018 pricing supplement,
    # which does state it. Logged in docs/project_log.md.
    used_for:
      - suspension of further sales and issuances effective 14 March 2022, which is
        why VXX can trade at a persistent premium or discount to indicative value
        and tracks the reconstructed index worse than VIXY after 2022
    verified: true

  - key: ipath_vxx_series_b_2018_launch
    issuer: Barclays Bank PLC
    cik: 312070
    form: 424B2
    date: "2018-01-04"
    title: iPath Series B ETN offering documents (VXXB / VXZB launch)
    url: https://www.sec.gov/Archives/edgar/data/312070/000110465918000637/a18-2032_4424b2.htm
    local_name: Barclays_iPath_SeriesB_launch_2018.htm
    used_for:
      - the January 2018 relaunch that makes the VXX price history two-segment
      - VXX investor fee rate of 0.89% per annum, used in the tracking validation
      - VXX is linked to the S&P 500 VIX Short-Term Futures Index **TR**, the
        total-return version, where XIV was linked to the excess-return version.
        The project reconstructs ER, so VXX's mean tracking residual carries a known
        bias of roughly the T-bill rate less the fee. See docs/limitations.md.
    verified: true      # 3/3 claims quoted. Caveat: this is the PRELIMINARY pricing
                        # supplement of 3 January 2018 ("the information ... is not
                        # complete and may be changed"); the final has not been
                        # archived, and the fee has not been re-checked against it.

  - key: vs_trust_svix_424b3
